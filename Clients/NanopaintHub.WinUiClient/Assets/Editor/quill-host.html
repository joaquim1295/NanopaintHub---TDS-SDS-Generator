<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor de Template</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #f8f8f8;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    #chromium-toolbar {
      display: none;
      gap: 8px;
      padding: 8px 10px;
      background: #1f2937;
      color: #fff;
      align-items: center;
      flex-wrap: wrap;
    }
    #chromium-toolbar.visible {
      display: flex;
    }
    #chromium-toolbar .title {
      flex: 1;
      font-weight: 600;
      font-size: 14px;
    }
    #chromium-toolbar button {
      font: inherit;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      cursor: pointer;
    }
    #btn-apply {
      background: #2563eb;
      color: #fff;
      font-weight: 600;
    }
    #btn-cancel {
      background: #374151;
      color: #fff;
    }
    #editor-container {
      height: calc(100% - 42px);
      background: #fff;
    }
    body.chromium-mode #editor-container {
      height: calc(100% - 90px);
    }
    #status {
      font-size: 12px;
      color: #666;
      padding: 6px 10px;
      border-top: 1px solid #ddd;
      background: #fff;
    }
  </style>
</head>
<body>
  <div id="chromium-toolbar">
    <span class="title">NanopaintHub — Editor visual (Quill)</span>
    <button type="button" id="btn-apply">Aplicar na NanopaintHub</button>
    <button type="button" id="btn-cancel">Cancelar</button>
  </div>
  <div id="editor-container"></div>
  <div id="status">A iniciar editor...</div>
  <script>
    const urlParams = new URLSearchParams(location.search);
    const chromiumMode = urlParams.get("mode") === "chromium";
    const sessionId = urlParams.get("session") || "";

    let quillInstance = null;
    let suppressChange = false;

    if (chromiumMode) {
      document.body.classList.add("chromium-mode");
      document.getElementById("chromium-toolbar").classList.add("visible");
    }

    async function postHostMessage(payload) {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(payload);
        return;
      }
      if (chromiumMode && sessionId) {
        try {
          await fetch("/api/event", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(Object.assign({ session: sessionId }, payload))
          });
        } catch (err) {
          console.warn("[QuillHost] event POST falhou", err);
        }
      }
    }

    function reportStatus(message, progress) {
      setStatus(message);
      postHostMessage({ type: "editor-status", message, progress });
    }

    function reportError(message) {
      setStatus("Erro: " + message);
      postHostMessage({ type: "editor-error", message });
      console.error("[QuillHost] " + message);
    }

    function loadStylesheet(href) {
      return new Promise((resolve, reject) => {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = href;
        link.onload = () => resolve();
        link.onerror = () => reject(new Error("Falha CSS: " + href));
        document.head.appendChild(link);
      });
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = src;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error("Falha JS: " + src));
        document.head.appendChild(script);
      });
    }

    async function ensureQuillLoaded() {
      try {
        reportStatus("A carregar assets locais do Quill...", 10);
        await loadStylesheet("./quill.snow.css");
        await loadScript("./quill.min.js");
        reportStatus("Assets locais do Quill carregados.", 30);
        return "local";
      } catch (localError) {
        console.warn("[QuillHost] Falha local, a tentar CDN.", localError);
        reportStatus("Assets locais falharam; a tentar CDN...", 20);
        await loadStylesheet("https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css");
        await loadScript("https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js");
        reportStatus("Assets Quill carregados por CDN.", 35);
        return "cdn";
      }
    }

    function setStatus(message) {
      const el = document.getElementById("status");
      if (el) {
        el.textContent = message;
      }
    }

    function createEditor() {
      quillInstance = new Quill("#editor-container", {
        theme: "snow",
        modules: {
          toolbar: [
            [{ header: [1, 2, 3, false] }],
            ["bold", "italic", "underline", "strike"],
            [{ color: [] }, { background: [] }],
            [{ align: [] }],
            [{ list: "ordered" }, { list: "bullet" }],
            [{ indent: "-1" }, { indent: "+1" }],
            ["link", "blockquote", "code-block"],
            ["clean"]
          ]
        }
      });
      quillInstance.on("text-change", () => {
        if (!suppressChange) {
          postHostMessage({ type: "content-changed", html: quillInstance.root.innerHTML });
        }
      });
    }

    async function loadInitialHtmlFromServer() {
      if (!chromiumMode || !sessionId) {
        return;
      }
      const res = await fetch("/api/html?session=" + encodeURIComponent(sessionId));
      if (!res.ok) {
        throw new Error("API /api/html respondeu " + res.status);
      }
      const data = await res.json();
      await window.setTemplateHtml(data.html || "");
    }

    async function applyToApp() {
      const html = await window.getTemplateHtml();
      const res = await fetch("/api/apply", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session: sessionId, html: html })
      });
      if (!res.ok) {
        throw new Error("Falha ao aplicar (" + res.status + ")");
      }
      setStatus("Conteúdo enviado para a NanopaintHub. A fechar...");
      window.close();
    }

    async function cancelEdit() {
      await fetch("/api/cancel", { method: "POST" });
      window.close();
    }

    function setupChromiumToolbar() {
      if (!chromiumMode) {
        return;
      }
      document.getElementById("btn-apply").addEventListener("click", () => {
        applyToApp().catch(err => reportError(String(err)));
      });
      document.getElementById("btn-cancel").addEventListener("click", () => {
        cancelEdit().catch(err => reportError(String(err)));
      });
    }

    async function initializeEditor() {
      if (quillInstance) {
        return;
      }
      try {
        reportStatus("A inicializar editor visual...", 5);
        const source = await ensureQuillLoaded();
        createEditor();
        setupChromiumToolbar();
        reportStatus(source === "local" ? "Editor local carregado." : "Editor carregado por CDN.", 50);
        if (chromiumMode) {
          await loadInitialHtmlFromServer();
        }
        postHostMessage({ type: "editor-ready" });
        reportStatus(chromiumMode
          ? "Edite o documento e clique «Aplicar na NanopaintHub»."
          : "Editor pronto para edição.", 100);
      } catch (err) {
        reportError("Não foi possível inicializar o Quill: " + String(err));
      }
    }

    window.setTemplateHtml = async function (html) {
      await initializeEditor();
      suppressChange = true;
      quillInstance.root.innerHTML = html || "";
      suppressChange = false;
    };

    window.getTemplateHtml = async function () {
      await initializeEditor();
      return quillInstance.root.innerHTML;
    };

    window.insertPlaceholder = async function (token) {
      await initializeEditor();
      const range = quillInstance.getSelection(true);
      const text = "{{" + token + "}}";
      if (!range) {
        quillInstance.insertText(quillInstance.getLength() - 1, text);
        return;
      }
      quillInstance.insertText(range.index, text);
      quillInstance.setSelection(range.index + text.length, 0);
    };

    window.addEventListener("error", (e) => {
      reportError("Erro JavaScript: " + (e.message || "desconhecido"));
    });

    initializeEditor();
  </script>
</body>
</html>
